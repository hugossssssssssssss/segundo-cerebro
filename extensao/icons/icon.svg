<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f172a" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.6" />
  
  <!-- Símbolo Neural / Conexões do Klaus -->
  <g transform="translate(24, 24)" filter="url(#glow)">
    <circle cx="40" cy="18" r="8" fill="#818cf8" />
    <circle cx="16" cy="52" r="7" fill="#c084fc" />
    <circle cx="64" cy="52" r="7" fill="#f472b6" />
    <circle cx="40" cy="68" r="9" fill="#38bdf8" />
    <circle cx="40" cy="40" r="11" fill="url(#grad)" />
    
    <!-- Linhas de conexão neural -->
    <path d="M40 18 L40 40 M16 52 L40 40 M64 52 L40 40 M40 68 L40 40 M16 52 L40 68 M64 52 L40 68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Ponto central de pulso -->
    <circle cx="40" cy="40" r="4" fill="#ffffff" />
  </g>
</svg>
