<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klaus — Header no Navegador</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img src="icons/icon32.png" alt="Logo Klaus" class="logo" />
    <div>
      <h1>Klaus</h1>
      <p class="sub">Header Oficial em Qualquer Site</p>
    </div>
  </header>

  <main class="content">
    <div class="card">
      <h2>Ambiente do Klaus</h2>
      <div class="field">
        <label for="klausUrl">URL da Aplicação</label>
        <input type="text" id="klausUrl" placeholder="https://hugossssssssssssss.github.io/segundo-cerebro" />
        <p class="hint">Use <code>http://localhost:5173</code> se estiver testando localmente com <code>npm run dev</code>.</p>
      </div>
    </div>

    <div class="card">
      <h2>Comportamento</h2>
      <label class="toggle-label">
        <input type="checkbox" id="barraFixada" />
        <span>Manter header sempre fixado no topo</span>
      </label>
      <p class="hint">Quando desmarcado, o header desliza suavemente ao aproximar o mouse do topo de qualquer site.</p>
    </div>
  </main>

  <footer class="footer">
    <button id="btnSalvar" class="btn-primario">Salvar Configurações</button>
    <div id="statusMsg" class="status-msg"></div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
